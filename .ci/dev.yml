    # echo "Pushing to $(PushBranch) branch..."
    # git push -u origin $(PushBranch)
  # displayName: "Push to GitHub $(PushBranch) branch"
  
# 推送套件到 Azure Artifacts（內部 Feed）
- script: |
    echo "🔁 正在推送套件到 Azure Artifacts Feed..."
    for pkg in $(Build.ArtifactStagingDirectory)/*.nupkg; do
      echo "📦 推送套件: $pkg"
      dotnet nuget push "$pkg" \
        --api-key $(System.AccessToken) \
        --source "$(PrivateSource)" \
        --skip-duplicate
    done
  displayName: 'Push NuGet Packages to Azure Artifacts'
  condition: and(succeeded(), ne(variables['PrivateSource'], ''))
  env:
    NUGET_CREDENTIALPROVIDERS_PLUGIN_HANDLING: ignore

# 推送套件到 nuget.org（外部 Feed）
- script: |
    echo "🔁 正在推送套件到 NuGet.org..."
    for pkg in $(Build.ArtifactStagingDirectory)/*.nupkg; do
      echo "📦 推送套件: $pkg"
      dotnet nuget push "$pkg" \
        --api-key $(NugetOrgApiKey) \
        --source "https://api.nuget.org/v3/index.json" \
        --skip-duplicate
    done
  displayName: 'Push NuGet Packages to NuGet.org'
  condition: and(succeeded(), ne(variables['NugetOrgApiKey'], ''))